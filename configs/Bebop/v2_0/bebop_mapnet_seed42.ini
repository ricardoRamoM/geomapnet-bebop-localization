[training]
n_epochs = 300
batch_size = 20
do_val = yes
seed = 42
shuffle = yes
num_workers = 4
snapshot = 10
val_freq = 1
max_grad_norm = 0

[optimization]
opt = adam
lr = 1e-4
weight_decay = 0.0005

[logging]
visdom = no
print_freq = 20

[hyperparameters]
beta = -3.0
gamma = -3.0
dropout = 0.5
skip = 10
variable_skip = no
real = no
steps = 3
color_jitter = 0.0