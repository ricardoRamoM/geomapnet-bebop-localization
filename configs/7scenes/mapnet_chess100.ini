[training]
n_epochs = 100
batch_size = 20
do_val = yes
seed = 7
shuffle = yes
num_workers = 5
snapshot = 25
val_freq = 25
max_grad_norm = 0

[optimization]
opt = adam
lr = 1e-4
weight_decay = 0.0005

[logging]
visdom = no
print_freq = 20

[hyperparameters]
beta = -3.0
gamma = -3.0
dropout = 0.5
skip = 10
variable_skip = no
real = no
steps = 3
color_jitter = 0.7
